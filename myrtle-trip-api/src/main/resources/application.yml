spring:
  datasource:
    url: ${MYRTLE_DB_URL:jdbc:postgresql://localhost:5432/myrtle_trip}
    username: ${MYRTLE_DB_USERNAME:myrtle_app}
    # Database credentials are intentionally not stored in source control.
    # Configure MYRTLE_DB_PASSWORD in the STS Run Configuration (or shell)
    # before starting the API locally.
    password: ${MYRTLE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Flyway is the schema source of truth. Existing non-empty databases
    # without a Flyway history table are baselined at version 1; fresh databases
    # execute V001__baseline.sql.
    enabled: ${MYRTLE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing Golf Event Manager schema
    clean-disabled: true
    validate-on-migrate: true

server:
  port: 8080
